
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 8 -- Complete Canvas Reference</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>PHYS 311 Lab 8 — Projectile Integrator</h1>

<!-- Simulation controls -->
<div class="panel">
  <label>Integrator
    <select id="integrator">
      <option value="verlet">Velocity Verlet</option>
      <option value="euler-cromer">Euler-Cromer</option>
      <option value="euler">Euler</option>
    </select>
  </label>

  <label>Scene
    <select id="scene">
      <option value="projectile">Projectile</option>
      <option value="spring">Spring Oscillator</option>
    </select>
  </label>

  <label>DT
    <select id="dt">
      <option value="120">1/120 s</option>
      <option value="20">1/20 s</option>
      <option value="240">1/240 s</option>
    </select>
  </label>

  <label>
    <input type="checkbox" id="fixed" checked>
    Fixed timestep
  </label>

  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
  <button id="lag">Simulate Lag</button>
  <button id="static">Static Scene</button>
  <button id="validate">Run Test</button>
</div>

<!-- Side-by-side simulation and graph -->
<div class="simulation-layout">
  <div class="simulation-panel">
    <canvas id="sim" width="900" height="520"></canvas>
  </div>

  <div class="energy-panel">
    <h2>Energy vs. Time</h2>
    <canvas id="energyGraph" width="400" height="520"></canvas>
  </div>
</div>

<p>
  See console for Vec2 tests.
  Click the static scene button for the (2,3) m circle.
  Use the checkbox, lag button, and integrator select.
  Switch between integrators and timesteps using the dropdowns.
</p>

<div id="log">Ready.</div>

<script type="module" src="main.js"></script>
